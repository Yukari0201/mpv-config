### ------- 说明 ------- ###

# 个人对 mpv 的默认快捷键 的改动相对较少
## mpv 的默认快捷键可以从这个链接获取 https://github.com/mpv-player/mpv/blob/master/etc/input.conf
## 或者 shinchiro 编译版的 \doc\mpbindings.png

# input.conf 注释部分基本和 主设置文件(mpv.conf) 相同，不重复说明了



UP    seek -60                          # seek 1 minute backward
DOWN  seek  60                          # seek 1 minute forward
PGUP  add chapter -1                    # seek to the previous chapter
PGDWN add chapter  1                    # seek to the next chapter
Shift+UP    no-osd seek -5 exact        # seek exactly 5 seconds backward
Shift+DOWN  no-osd seek  5 exact        # seek exactly 5 seconds forward
Shift+PGUP  seek -600                   # seek 10 minutes backward
Shift+PGDWN seek  600                   # seek 10 minutes forward

# 依赖于 inputevent.lua
# https://github.com/natural-harmonia-gropius/input-event
# 长按右方向键倍速播放，释放恢复
RIGHT seek 5                            #event: click
RIGHT no-osd set speed 2                #event: press
RIGHT ignore                            #event: release
# 单击鼠标左键暂停，双击全屏
MBTN_LEFT       cycle pause             #event: click
MBTN_LEFT       cycle fullscreen        #event: double_click
MBTN_LEFT_DBL   ignore

# 切换视频解码模式
Ctrl+h cycle-values hwdec "auto" "no"   # 硬解
Ctrl+H cycle-values hwdec "auto-copy" "no"
                                        # 硬解+ (硬解-copy)

m cycle window-maximized                # 最大化
M cycle window-minimized                # 最小化

# 鼠标右键显示 stats -> 文件信息
MBTN_RIGHT script-binding stats/display-page-5-toggle

### 脚本 ###

# * console
# set hwdec
Alt+h script-message-to console type "set hwdec ;keypress ESC" 11
# 加载指定文件
# l 原本绑定 A-B循环
l script-message-to console type "loadfile '';keypress ESC" 11
# show-text
# 提示：多用 TAP 键补全
Alt+s script-message-to console type "show-text ${" 13
# apply-profile
Alt+a script-message-to console type "apply-profile ;keypress ESC" 15
Alt+A script-message-to console type "apply-profile  restore;keypress ESC" 15

# * quality-menu
n script-binding quality_menu/video_formats_toggle
N script-binding quality_menu/audio_formats_toggle



## 切换 vo=gpu/gpu-next
Ctrl+Alt+v cycle-values vo "gpu" "gpu-next"
                                        # 切换视频输出驱动

## 时域插值
# sphinx 可更改为 blurmotion 或 smoothmotion，详见 profile.conf
Ctrl+t apply-profile sphinx; show-text "apply-profile sphinx"
Ctrl+T apply-profile sphinx restore; show-text "profile sphinx restore"

### 音频 ###
a cycle audio-exclusive                 # 切换音频独占（独占模式“经常”会“偶尔”出小问题。。。）



### 字幕 ###
# 让 ASS字幕显示在黑边上，详见 [ASS2margins]
Ctrl+Alt+s apply-profile ASS2margins; show-text "让ASS字幕显示在黑边上"
Ctrl+Alt+S apply-profile ASS2margins restore; show-text "ASS->margins restore"


### 画质相关 ###
# * 去瑕疵
Ctrl+d cycle deband                     # deband 去色带
Ctrl+D cycle deinterlace                # deinterlacing 反交错
                                        # 默认快捷键 d



### 音视频滤镜 ##

# * 让弹幕更流畅
# !注意! 和补帧类滤镜冲突
# 强制视频以指定帧率输出
Alt+t vf toggle lavfi="fps=fps=60/1.001"
# 帧混合（线性插值），需要 -copy模式硬解/软解
Alt+T vf toggle lavfi="framerate=fps=60/1.001"; no-osd set hwdec auto-copy



### 着色器 ###

# * 清空着色器列表
CTRL+` no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"
CTRL+~ no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"

# 见 [UHD2FHD]
# ! 弃用
# Alt+( apply-profile UHD2FHD; show-text "apply UHD->FHD"
# Alt+9 apply-profile UHD2FHD restore; show-text "UHD->FHD restore"

